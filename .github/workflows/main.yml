name: Actualizar precios OMIE

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"
      timezone: "Europe/Madrid"

permissions:
  contents: write

jobs:
  actualizar-omie:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Obtener precios OMIE
        shell: python
        run: |
          import urllib.request
          import urllib.error
          import datetime
          import json
          import base64
          import os
          from zoneinfo import ZoneInfo

          MADRID = ZoneInfo("Europe/Madrid")

          hoy = datetime.datetime.now(MADRID).date()
          manana = hoy + datetime.timedelta(days=1)

          print("Fecha de hoy:", hoy)
          print("Fecha de mañana:", manana)


          # ==================================================
          # DESCARGAR PRECIOS OMIE
          # ==================================================

          def descargar_precios(fecha):

              fecha_str = fecha.strftime("%Y%m%d")

              url = (
                  "https://www.omie.es/en/file-download"
                  "?parents=marginalpdbc"
                  f"&filename=marginalpdbc_{fecha_str}.1"
              )

              print("")
              print("Descargando:")
              print(url)

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as respuesta:

                      contenido = respuesta.read()

              except urllib.error.HTTPError as error:

                  if error.code == 404:

                      print(
                          "OMIE todavía no ha publicado "
                          "este fichero."
                      )

                      return None

                  raise

              texto = contenido.decode(
                  "latin-1",
                  errors="replace"
              )

              precios = []

              for linea in texto.splitlines():

                  linea = linea.strip()

                  if not linea:
                      continue

                  columnas = linea.split(";")

                  if len(columnas) < 6:
                      continue

                  try:

                      anio = int(columnas[0])
                      mes = int(columnas[1])
                      dia = int(columnas[2])
                      periodo = int(columnas[3])

                      precio = float(
                          columnas[5]
                          .strip()
                          .replace(",", ".")
                      )

                  except (ValueError, TypeError):

                      continue

                  if (
                      anio != fecha.year
                      or mes != fecha.month
                      or dia != fecha.day
                  ):

                      continue

                  precios.append({
                      "periodo": periodo,
                      "precio": precio
                  })

              cantidad = len(precios)

              print(
                  "Registros encontrados:",
                  cantidad
              )

              if cantidad not in (92, 96, 100):

                  raise Exception(
                      f"Numero de registros inesperado "
                      f"para {fecha_str}: {cantidad}"
                  )

              precios.sort(
                  key=lambda x: x["periodo"]
              )

              return [
                  x["precio"]
                  for x in precios
              ]


          # ==================================================
          # COMPROBAR MAÑANA
          # ==================================================

          precios_manana = descargar_precios(manana)


          if precios_manana is None:

              datos = {

                  "available": False,

                  "fecha_manana":
                      manana.isoformat(),

                  "motivo":
                      "OMIE todavía no ha publicado "
                      "los precios de mañana."
              }

              print("")
              print(
                  "MAÑANA TODAVÍA NO ESTÁ DISPONIBLE."
              )

          else:

              # ==================================================
              # MAÑANA EXISTE -> OBTENER HOY
              # ==================================================

              precios_hoy = descargar_precios(hoy)

              if precios_hoy is None:

                  raise Exception(
                      "OMIE tiene mañana disponible "
                      "pero no se ha podido obtener "
                      "el fichero de hoy."
                  )

              datos = {

                  "available": True,

                  "fecha_hoy":
                      hoy.isoformat(),

                  "fecha_manana":
                      manana.isoformat(),

                  "hoy": {

                      "registros":
                          len(precios_hoy),

                      "precios":
                          precios_hoy
                  },

                  "manana": {

                      "registros":
                          len(precios_manana),

                      "precios":
                          precios_manana
                  }
              }

              print("")
              print(
                  "======================================"
              )
              print(
                  " DATOS OMIE DISPONIBLES"
              )
              print(
                  "======================================"
              )

              print(
                  "Hoy:",
                  len(precios_hoy)
              )

              print(
                  "Mañana:",
                  len(precios_manana)
              )


          # ==================================================
          # COMPROBAR SI LOS DATOS HAN CAMBIADO
          # ==================================================

          datos_actuales = None

          if os.path.exists("omie.json"):

              try:

                  with open(
                      "omie.json",
                      "r",
                      encoding="utf-8"
                  ) as archivo:

                      datos_actuales = json.load(
                          archivo
                      )

              except Exception:

                  print(
                      "No se ha podido leer "
                      "el omie.json existente."
                  )


          datos_nuevos_texto = json.dumps(
              datos,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":")
          )

          datos_actuales_texto = None

          if datos_actuales is not None:

              datos_actuales_texto = json.dumps(
                  datos_actuales,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":")
              )


          # ==================================================
          # SI NO HAY CAMBIOS -> NO HACER NADA
          # ==================================================

          if (
              datos_actuales_texto is not None
              and datos_actuales_texto ==
                  datos_nuevos_texto
          ):

              print("")
              print(
                  "Los datos OMIE no han cambiado."
              )

              print(
                  "No se actualizarán "
                  "omie.json ni omie.xml."
              )

              print(
                  "No se realizará ningún commit."
              )

              exit(0)


          # ==================================================
          # LOS DATOS HAN CAMBIADO
          # ==================================================

          print("")
          print(
              "======================================"
          )
          print(
              " CAMBIO DETECTADO EN DATOS OMIE"
          )
          print(
              "======================================"
          )


          # ==================================================
          # GUARDAR JSON
          # ==================================================

          with open(
              "omie.json",
              "w",
              encoding="utf-8"
          ) as archivo:

              json.dump(
                  datos,
                  archivo,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print(
              "omie.json actualizado correctamente."
          )


          # ==================================================
          # CREAR RSS PARA POWER AUTOMATE
          # ==================================================

          json_texto = json.dumps(
              datos,
              ensure_ascii=False,
              separators=(",", ":")
          )

          contenido_base64 = base64.b64encode(
              json_texto.encode("utf-8")
          ).decode("ascii")


          ahora_utc = datetime.datetime.now(
              datetime.timezone.utc
          )


          fecha_rss = ahora_utc.strftime(
              "%a, %d %b %Y %H:%M:%S GMT"
          )


          identificador = (
              "omie-" +
              ahora_utc.strftime(
                  "%Y%m%d%H%M%S"
              )
          )


          rss = f"""<?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0">
            <channel>
              <title>OMIE Precios</title>

              <link>
                https://github.com/edgarsanchoaqlara-droid/omie-precios
              </link>

              <description>
                Datos diarios de precios OMIE
              </description>

              <item>

                <title>
                  OMIE {hoy.isoformat()}
                </title>

                <link>
                  https://github.com/edgarsanchoaqlara-droid/omie-precios
                </link>

                <guid isPermaLink="false">
                  {identificador}
                </guid>

                <pubDate>
                  {fecha_rss}
                </pubDate>

                <description>
                  {contenido_base64}
                </description>

              </item>

            </channel>
          </rss>
          """


          with open(
              "omie.xml",
              "w",
              encoding="utf-8"
          ) as archivo:

              archivo.write(rss)


          print("")
          print(
              "omie.xml actualizado correctamente."
          )


      # ==================================================
      # GUARDAR RESULTADOS EN GITHUB
      # ==================================================

      - name: Guardar resultado
        shell: bash
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add omie.json omie.xml

          if git diff --cached --quiet; then

            echo "No hay cambios en los datos OMIE."

          else

            git commit \
              -m "Actualizar precios OMIE"

            git push

          fi
