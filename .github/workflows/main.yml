name: Actualizar precios OMIE

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"
      timezone: "Europe/Madrid"

permissions:
  contents: write

jobs:
  actualizar-omie:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Obtener precios OMIE
        shell: python
        run: |
          import urllib.request
          import urllib.error
          import datetime
          import json
          import base64
          import os
          from zoneinfo import ZoneInfo


          # ==================================================
          # CONFIGURACION
          # ==================================================

          MADRID = ZoneInfo("Europe/Madrid")

          ahora = datetime.datetime.now(MADRID)

          fecha_hoy_real = ahora.date()


          print("")
          print("======================================")
          print(" ACTUALIZACION OMIE")
          print("======================================")
          print("Fecha/hora Madrid:", ahora)
          print("Fecha actual:", fecha_hoy_real)


          # ==================================================
          # LEER ESTADO ANTERIOR
          # ==================================================

          estado_anterior = None

          if os.path.exists("omie.json"):

              try:

                  with open(
                      "omie.json",
                      "r",
                      encoding="utf-8"
                  ) as archivo:

                      estado_anterior = json.load(
                          archivo
                      )

                  print("")
                  print(
                      "Estado anterior encontrado."
                  )

              except Exception as error:

                  print("")
                  print(
                      "No se ha podido leer "
                      "el estado anterior:"
                  )

                  print(error)


          # ==================================================
          # DETERMINAR FECHA OBJETIVO
          # ==================================================

          fecha_objetivo = None

          objetivo_anterior = None

          disponible_anterior = False


          if estado_anterior is not None:

              objetivo_anterior = (
                  estado_anterior.get(
                      "fecha_objetivo"
                  )
              )

              disponible_anterior = (
                  estado_anterior.get(
                      "available",
                      False
                  )
              )


          # --------------------------------------------------
          # SI EXISTE UN OBJETIVO PENDIENTE
          # --------------------------------------------------

          if (
              objetivo_anterior
              and not disponible_anterior
          ):

              fecha_objetivo = datetime.date.fromisoformat(
                  objetivo_anterior
              )

              print("")
              print(
                  "Se mantiene el objetivo pendiente:"
              )

              print(
                  fecha_objetivo
              )


          # --------------------------------------------------
          # SI EL OBJETIVO ANTERIOR YA ESTABA DISPONIBLE
          # --------------------------------------------------

          elif (
              objetivo_anterior
              and disponible_anterior
          ):

              fecha_objetivo_anterior = (
                  datetime.date.fromisoformat(
                      objetivo_anterior
                  )
              )


              # Si ya estamos en un nuevo ciclo
              # después de las 14:30, buscamos
              # el día siguiente.

              if (
                  fecha_hoy_real
                  > fecha_objetivo_anterior
                  or (
                      fecha_hoy_real
                      == fecha_objetivo_anterior
                      and ahora.hour >= 14
                      and ahora.minute >= 30
                  )
              ):

                  fecha_objetivo = (
                      fecha_hoy_real
                      + datetime.timedelta(days=1)
                  )

                  print("")
                  print(
                      "Nuevo ciclo OMIE."
                  )


              else:

                  fecha_objetivo = (
                      fecha_objetivo_anterior
                  )

                  print("")
                  print(
                      "Se mantiene el objetivo anterior:"
                  )

                  print(
                      fecha_objetivo
                  )


          # --------------------------------------------------
          # SI NO EXISTE ESTADO ANTERIOR
          # --------------------------------------------------

          else:

              fecha_objetivo = (
                  fecha_hoy_real
                  + datetime.timedelta(days=1)
              )

              print("")
              print(
                  "No existe objetivo anterior."
              )

              print(
                  "Nuevo objetivo:",
                  fecha_objetivo
              )


          print("")
          print(
              "FECHA OBJETIVO:",
              fecha_objetivo
          )


          # ==================================================
          # DESCARGAR PRECIOS OMIE
          # ==================================================

          def descargar_precios(fecha):

              fecha_str = fecha.strftime(
                  "%Y%m%d"
              )


              url = (
                  "https://www.omie.es/en/file-download"
                  "?parents=marginalpdbc"
                  f"&filename=marginalpdbc_{fecha_str}.1"
              )


              print("")
              print(
                  "Descargando OMIE:"
              )

              print(
                  "Fecha:",
                  fecha
              )

              print(
                  url
              )


              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          "Mozilla/5.0"
                  }
              )


              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as respuesta:

                      contenido = respuesta.read()


              except urllib.error.HTTPError as error:

                  if error.code == 404:

                      print("")
                      print(
                          "OMIE todavía no ha publicado "
                          "este fichero."
                      )

                      return None

                  raise


              texto = contenido.decode(
                  "latin-1",
                  errors="replace"
              )


              precios = []


              for linea in texto.splitlines():

                  linea = linea.strip()


                  if not linea:

                      continue


                  columnas = linea.split(";")


                  if len(columnas) < 6:

                      continue


                  try:

                      anio = int(
                          columnas[0]
                      )

                      mes = int(
                          columnas[1]
                      )

                      dia = int(
                          columnas[2]
                      )

                      periodo = int(
                          columnas[3]
                      )


                      precio = float(
                          columnas[5]
                          .strip()
                          .replace(",", ".")
                      )


                  except (
                      ValueError,
                      TypeError
                  ):

                      continue


                  if (
                      anio != fecha.year
                      or mes != fecha.month
                      or dia != fecha.day
                  ):

                      continue


                  precios.append({
                      "periodo": periodo,
                      "precio": precio
                  })


              cantidad = len(
                  precios
              )


              print(
                  "Registros encontrados:",
                  cantidad
              )


              if cantidad not in (
                  92,
                  96,
                  100
              ):

                  raise Exception(
                      f"Numero de registros "
                      f"inesperado para "
                      f"{fecha_str}: "
                      f"{cantidad}"
                  )


              precios.sort(
                  key=lambda x:
                      x["periodo"]
              )


              return [
                  x["precio"]
                  for x in precios
              ]


          # ==================================================
          # COMPROBAR FECHA OBJETIVO
          # ==================================================

          precios_objetivo = (
              descargar_precios(
                  fecha_objetivo
              )
          )


          # ==================================================
          # SI TODAVIA NO EXISTE
          # ==================================================

          if precios_objetivo is None:

              datos = {

                  "available": False,

                  "fecha_objetivo":
                      fecha_objetivo.isoformat(),

                  "fecha_manana":
                      fecha_objetivo.isoformat(),

                  "motivo":
                      "OMIE todavía no ha publicado "
                      "los precios de la fecha objetivo."
              }


              print("")
              print(
                  "======================================"
              )

              print(
                  " OMIE NO DISPONIBLE"
              )

              print(
                  " Objetivo:",
                  fecha_objetivo
              )

              print(
                  "======================================"
              )


          # ==================================================
          # SI YA EXISTE
          # ==================================================

          else:

              print("")
              print(
                  "======================================"
              )

              print(
                  " OMIE DISPONIBLE"
              )

              print(
                  " Objetivo:",
                  fecha_objetivo
              )

              print(
                  " Registros:",
                  len(precios_objetivo)
              )

              print(
                  "======================================"
              )


              # --------------------------------------------------
              # OBTENER TAMBIEN EL DIA ANTERIOR
              # --------------------------------------------------

              fecha_anterior = (
                  fecha_objetivo
                  - datetime.timedelta(days=1)
              )


              precios_anterior = (
                  descargar_precios(
                      fecha_anterior
                  )
              )


              if precios_anterior is None:

                  raise Exception(
                      "OMIE tiene disponible "
                      "la fecha objetivo pero "
                      "no se ha podido obtener "
                      "el día anterior."
                  )


              datos = {

                  "available": True,

                  "fecha_objetivo":
                      fecha_objetivo.isoformat(),

                  "fecha_hoy":
                      fecha_anterior.isoformat(),

                  "fecha_manana":
                      fecha_objetivo.isoformat(),

                  "hoy": {

                      "registros":
                          len(precios_anterior),

                      "precios":
                          precios_anterior
                  },

                  "manana": {

                      "registros":
                          len(precios_objetivo),

                      "precios":
                          precios_objetivo
                  }
              }


          # ==================================================
          # COMPARAR CON EL ESTADO ANTERIOR
          # ==================================================

          datos_nuevos_texto = json.dumps(
              datos,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":")
          )


          datos_actuales_texto = None


          if estado_anterior is not None:

              datos_actuales_texto = json.dumps(
                  estado_anterior,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":")
              )


          # ==================================================
          # SI NO HA CAMBIADO NADA
          # ==================================================

          if (
              datos_actuales_texto is not None
              and datos_actuales_texto
              == datos_nuevos_texto
          ):

              print("")
              print(
                  "Los datos no han cambiado."
              )

              print(
                  "No se actualiza GitHub."
              )

              exit(0)


          # ==================================================
          # GUARDAR JSON
          # ==================================================

          with open(
              "omie.json",
              "w",
              encoding="utf-8"
          ) as archivo:

              json.dump(
                  datos,
                  archivo,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print(
              "omie.json actualizado."
          )


          # ==================================================
          # CREAR RSS
          # ==================================================

          json_texto = json.dumps(
              datos,
              ensure_ascii=False,
              separators=(",", ":")
          )


          contenido_base64 = (
              base64.b64encode(
                  json_texto.encode("utf-8")
              ).decode("ascii")
          )


          ahora_utc = (
              datetime.datetime.now(
                  datetime.timezone.utc
              )
          )


          fecha_rss = (
              ahora_utc.strftime(
                  "%a, %d %b %Y %H:%M:%S GMT"
              )
          )


          identificador = (
              "omie-" +
              ahora_utc.strftime(
                  "%Y%m%d%H%M%S"
              )
          )


          rss = f"""<?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0">
            <channel>
              <title>OMIE Precios</title>

              <link>
                https://github.com/edgarsanchoaqlara-droid/omie-precios
              </link>

              <description>
                Datos diarios de precios OMIE
              </description>

              <item>

                <title>
                  OMIE {fecha_objetivo.isoformat()}
                </title>

                <link>
                  https://github.com/edgarsanchoaqlara-droid/omie-precios
                </link>

                <guid isPermaLink="false">
                  {identificador}
                </guid>

                <pubDate>
                  {fecha_rss}
                </pubDate>

                <description>
                  {contenido_base64}
                </description>

              </item>

            </channel>
          </rss>
          """


          with open(
              "omie.xml",
              "w",
              encoding="utf-8"
          ) as archivo:

              archivo.write(
                  rss
              )


          print("")
          print(
              "omie.xml actualizado."
          )


      # ==================================================
      # GUARDAR RESULTADOS EN GITHUB
      # ==================================================

      - name: Guardar resultado
        shell: bash
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add omie.json omie.xml


          if git diff --cached --quiet; then

            echo "No hay cambios en los datos OMIE."

          else

            git commit \
              -m "Actualizar precios OMIE"

            git push

          fi
