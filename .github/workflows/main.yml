name: Actualizar precios OMIE

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"
      timezone: "Europe/Madrid"

permissions:
  contents: write

jobs:
  actualizar-omie:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Obtener precios OMIE
        shell: python
        run: |
          import urllib.request
          import urllib.error
          import datetime
          import json
          import base64
          import os
          from zoneinfo import ZoneInfo


          # ==================================================
          # CONFIGURACION
          # ==================================================

          MADRID = ZoneInfo("Europe/Madrid")

          ahora = datetime.datetime.now(MADRID)

          fecha_hoy_real = ahora.date()


          print("")
          print("======================================")
          print(" ACTUALIZACION OMIE")
          print("======================================")
          print("Fecha/hora Madrid:", ahora)
          print("Fecha actual:", fecha_hoy_real)


          # ==================================================
          # LEER ESTADO ANTERIOR
          # ==================================================

          estado_anterior = None

          if os.path.exists("omie.json"):

              try:

                  with open(
                      "omie.json",
                      "r",
                      encoding="utf-8"
                  ) as archivo:

                      estado_anterior = json.load(
                          archivo
                      )

                  print("")
                  print(
                      "Estado anterior encontrado."
                  )

              except Exception as error:

                  print("")
                  print(
                      "No se ha podido leer "
                      "el estado anterior:"
                  )

                  print(error)


          # ==================================================
          # DETERMINAR FECHAS A COMPROBAR
          # ==================================================

          objetivo_anterior = None
          disponible_anterior = False

          if estado_anterior is not None:

              objetivo_anterior = estado_anterior.get(
                  "fecha_objetivo"
              )

              disponible_anterior = estado_anterior.get(
                  "available",
                  False
              )

          # Si hay un objetivo pendiente, se vuelve a intentar
          # esa misma fecha hasta que OMIE publique el fichero.
          if objetivo_anterior and not disponible_anterior:

              fecha_objetivo = datetime.date.fromisoformat(
                  objetivo_anterior
              )

              fechas_a_probar = [fecha_objetivo]

              print("Se mantiene el objetivo pendiente:", fecha_objetivo)

          # Si el JSON anterior es válido, se comprueba el día
          # siguiente. Si OMIE aún no lo ha publicado, se conserva
          # íntegro el JSON/XML anterior.
          elif objetivo_anterior and disponible_anterior:

              fecha_objetivo = (
                  datetime.date.fromisoformat(objetivo_anterior)
                  + datetime.timedelta(days=1)
              )

              fechas_a_probar = [fecha_objetivo]

              print("Siguiente fecha a comprobar:", fecha_objetivo)

          # Si no existe un estado anterior (o no se puede leer),
          # buscar la publicación más reciente disponible: mañana,
          # hoy y, si todavía no se ha publicado hoy, ayer.
          else:

              fechas_a_probar = [
                  fecha_hoy_real + datetime.timedelta(days=1),
                  fecha_hoy_real,
                  fecha_hoy_real - datetime.timedelta(days=1)
              ]

              fecha_objetivo = fechas_a_probar[0]

              print("No hay un JSON anterior válido.")
              print("Se probarán las fechas, de más reciente a más antigua:", fechas_a_probar)


          # ==================================================
          # DESCARGAR PRECIOS OMIE
          # ==================================================

          def descargar_precios(fecha):

              fecha_str = fecha.strftime(
                  "%Y%m%d"
              )


              url = (
                  "https://www.omie.es/en/file-download"
                  "?parents=marginalpdbc"
                  f"&filename=marginalpdbc_{fecha_str}.1"
              )


              print("")
              print(
                  "Descargando OMIE:"
              )

              print(
                  "Fecha:",
                  fecha
              )

              print(
                  url
              )


              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          "Mozilla/5.0"
                  }
              )


              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as respuesta:

                      contenido = respuesta.read()


              except urllib.error.HTTPError as error:

                  if error.code == 404:

                      print("")
                      print(
                          "OMIE todavía no ha publicado "
                          "este fichero."
                      )

                      return None

                  raise


              texto = contenido.decode(
                  "latin-1",
                  errors="replace"
              )


              precios = []


              for linea in texto.splitlines():

                  linea = linea.strip()


                  if not linea:

                      continue


                  columnas = linea.split(";")


                  if len(columnas) < 6:

                      continue


                  try:

                      anio = int(
                          columnas[0]
                      )

                      mes = int(
                          columnas[1]
                      )

                      dia = int(
                          columnas[2]
                      )

                      periodo = int(
                          columnas[3]
                      )


                      precio = float(
                          columnas[5]
                          .strip()
                          .replace(",", ".")
                      )


                  except (
                      ValueError,
                      TypeError
                  ):

                      continue


                  if (
                      anio != fecha.year
                      or mes != fecha.month
                      or dia != fecha.day
                  ):

                      continue


                  precios.append({
                      "periodo": periodo,
                      "precio": precio
                  })


              cantidad = len(
                  precios
              )


              print(
                  "Registros encontrados:",
                  cantidad
              )


              if cantidad not in (
                  92,
                  96,
                  100
              ):

                  print(
                      f"Fichero no válido para {fecha_str}: "
                      f"se esperaban 92, 96 o 100 registros y hay {cantidad}."
                  )

                  return None


              precios.sort(
                  key=lambda x:
                      x["periodo"]
              )


              return [
                  x["precio"]
                  for x in precios
              ]


          # ==================================================
          # BUSCAR LA PUBLICACION OMIE MAS RECIENTE DISPONIBLE
          # ==================================================

          precios_objetivo = None
          fecha_encontrada = None

          for fecha_candidata in fechas_a_probar:

              precios_candidatos = descargar_precios(fecha_candidata)

              if precios_candidatos is not None:

                  # La publicación debe tener también el día anterior,
                  # porque el JSON/RSS entrega hoy y mañana juntos.
                  fecha_previa = fecha_candidata - datetime.timedelta(days=1)
                  precios_previos_candidatos = descargar_precios(fecha_previa)

                  if precios_previos_candidatos is not None:
                      fecha_objetivo = fecha_candidata
                      precios_objetivo = precios_candidatos
                      precios_anterior = precios_previos_candidatos
                      fecha_anterior = fecha_previa
                      fecha_encontrada = fecha_candidata
                      break

                  print(
                      "La fecha candidata está publicada, pero no se ha podido "
                      "obtener el día anterior; se probará la siguiente fecha."
                  )

          if precios_objetivo is None:

              print("")
              print("No se ha encontrado una publicación OMIE válida con el día anterior disponible.")

              if estado_anterior is not None:
                  print("Se conservan omie.json y omie.xml sin modificar.")
              else:
                  print("No se crea un estado incompleto; se volverá a intentar en la siguiente ejecución.")

              raise SystemExit(0)

          print("Publicación OMIE seleccionada:", fecha_encontrada)


          # ==================================================
          # CONSTRUIR DATOS PARA JSON Y RSS
          # ==================================================

          datos = {

              "available": True,

              "fecha_objetivo":
                  fecha_objetivo.isoformat(),

              "fecha_hoy":
                  fecha_anterior.isoformat(),

              "fecha_manana":
                  fecha_objetivo.isoformat(),

              "hoy": {

                  "registros":
                      len(precios_anterior),

                  "precios":
                      precios_anterior
              },

              "manana": {

                  "registros":
                      len(precios_objetivo),

                  "precios":
                      precios_objetivo
              }
          }


          # ==================================================
          # COMPARAR CON EL ESTADO ANTERIOR
          # ==================================================

          datos_nuevos_texto = json.dumps(
              datos,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":")
          )


          datos_actuales_texto = None


          if estado_anterior is not None:

              datos_actuales_texto = json.dumps(
                  estado_anterior,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":")
              )


          # ==================================================
          # SI NO HA CAMBIADO NADA
          # ==================================================

          if (
              datos_actuales_texto is not None
              and datos_actuales_texto
              == datos_nuevos_texto
          ):

              print("")
              print(
                  "Los datos no han cambiado."
              )

              print(
                  "No se actualiza GitHub."
              )

              exit(0)


          # ==================================================
          # GUARDAR JSON
          # ==================================================

          with open(
              "omie.json",
              "w",
              encoding="utf-8"
          ) as archivo:

              json.dump(
                  datos,
                  archivo,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print(
              "omie.json actualizado."
          )


          # ==================================================
          # CREAR RSS
          # ==================================================

          json_texto = json.dumps(
              datos,
              ensure_ascii=False,
              separators=(",", ":")
          )


          contenido_base64 = (
              base64.b64encode(
                  json_texto.encode("utf-8")
              ).decode("ascii")
          )


          ahora_utc = (
              datetime.datetime.now(
                  datetime.timezone.utc
              )
          )


          fecha_rss = (
              ahora_utc.strftime(
                  "%a, %d %b %Y %H:%M:%S GMT"
              )
          )


          identificador = (
              "omie-" +
              ahora_utc.strftime(
                  "%Y%m%d%H%M%S"
              )
          )


          rss = f"""<?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0">
            <channel>
              <title>OMIE Precios</title>

              <link>
                https://github.com/edgarsanchoaqlara-droid/omie-precios
              </link>

              <description>
                Datos diarios de precios OMIE
              </description>

              <item>

                <title>
                  OMIE {fecha_objetivo.isoformat()}
                </title>

                <link>
                  https://github.com/edgarsanchoaqlara-droid/omie-precios
                </link>

                <guid isPermaLink="false">
                  {identificador}
                </guid>

                <pubDate>
                  {fecha_rss}
                </pubDate>

                <description>
                  {contenido_base64}
                </description>

              </item>

            </channel>
          </rss>
          """


          with open(
              "omie.xml",
              "w",
              encoding="utf-8"
          ) as archivo:

              archivo.write(
                  rss
              )


          print("")
          print(
              "omie.xml actualizado."
          )


      # ==================================================
      # GUARDAR RESULTADOS EN GITHUB
      # ==================================================

      - name: Guardar resultado
        shell: bash
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add omie.json omie.xml


          if git diff --cached --quiet; then

            echo "No hay cambios en los datos OMIE."

          else

            git commit \
              -m "Actualizar precios OMIE"

            git push

          fi
